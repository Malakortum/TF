<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>จริงหรือมั่ว!</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800;900&family=Chonburi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a0b12;font-family:"Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(900px,92vw);max-height:94vh;overflow:auto;box-sizing:border-box;
        display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:32px 28px;
        background:radial-gradient(circle at 50% 0%,#c4182f,#6e0a1a);border-radius:28px;border:6px solid #ffcf3a;
        box-shadow:0 0 0 6px #6e0a1a,0 0 40px rgba(255,207,58,.6)}
  .card h1{margin:0;font-family:"Chonburi","Kanit",serif;font-weight:400;font-size:clamp(46px,7vw,90px);line-height:1.1;color:#ffcf3a;text-shadow:0 5px 0 #6e0a1a,0 0 24px rgba(255,207,58,.6)}
  .card p{font-size:clamp(17px,2vw,24px);margin:0;line-height:1.5}
  .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-size:clamp(20px,2.4vw,28px);font-weight:900;padding:12px 34px;border:0;border-radius:999px;cursor:pointer;color:#5a0612;
         background:linear-gradient(180deg,#ffe58a,#ffbf1f);box-shadow:0 6px 0 #a87400}
  button:active{transform:translateY(5px);box-shadow:0 1px 0 #a87400}
  button.tog{font-size:clamp(17px,1.8vw,22px);padding:8px 22px;background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.4)}
  button.tog.on{background:#ffcf3a;color:#5a0612;border-color:transparent}
  .chip{font-weight:900;padding:6px 18px;border-radius:999px;font-size:clamp(17px,2vw,24px)}
  .hidden{display:none!important}
  #status{font-size:16px;color:#ffd9de}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>

<div id="start" class="card">
  <h1>จริงหรือมั่ว!</h1>
  <p>โจทย์เลขขึ้นจอพร้อมคำตอบ คิดให้ไว แล้ว<b>วิ่งไปยืนฝั่งที่ใช่</b>ก่อนหมดเวลา!</p>
  <div class="row"><span class="chip" style="background:#2fbf5a">← ฝั่งซ้าย = จริง ✓</span><span class="chip" style="background:#e8402a">มั่ว ✗ = ฝั่งขวา →</span></div>
  <p style="font-size:.9em">ระวังรอบ <b style="color:#ffcf3a">สลับฝั่ง!</b> · เล่นพร้อมกันได้หลายคน · ยิ่งเล่นยิ่งเร็ว!</p>
  <div class="row">
    <span style="font-weight:800">ระดับ:</span>
    <button id="lv0" class="tog on" onclick="setLv(0)">ง่าย (บวก ลบ)</button>
    <button id="lv1" class="tog" onclick="setLv(1)">ยาก (คูณ หาร)</button>
  </div>
  <div class="row"><button onclick="startGame()">เริ่มเกม!</button></div>
  <p style="font-size:15px;color:#ffd9de">ยืนห่างกล้อง 2–3 เมตร ให้กล้องเห็นทุกคน · กด M เปิด/ปิดเพลง</p>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const video = document.getElementById('video'), statusEl = document.getElementById('status');
const FONT = 'Kanit,Tahoma,sans-serif', GOLD = '#ffcf3a', GREEN = '#2fbf5a', RED = '#e8402a';
const ROUNDS = 20, MID = 0.08; // ช่วงกลางจอ ±8% = ยืนลังเล
let W, H, DPR = 1, level = 0, state = 'menu', lastT = 0, countdown = 0, lastBeep = 4;
let round = 0, q = null, phase = 'ask', phaseT = 0, swapNext = false, people = [], particles = [], floaters = [], banner = null;
let teamScore = 0, correctPeople = 0, totalPeople = 0, allRight = 0, streak = 0, bestStreak = 0, flash = null;

function resize(){ DPR = Math.min(2, devicePixelRatio||1); W = innerWidth; H = innerHeight; canvas.width = W*DPR; canvas.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize', resize);

// ---------- เสียง + เพลง ----------
let actx = null, master = null, mus = null;
function audio(){
  if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); master = actx.createGain(); master.connect(actx.destination); mus = actx.createGain(); mus.gain.value = 0.45; mus.connect(master); } catch {}
  if (actx && actx.state === 'suspended') actx.resume(); return actx;
}
function osc(f, t, d, type='triangle', vol=0.1, f2=null, out){ if (!actx) return; const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+0.005); g.gain.exponentialRampToValueAtTime(0.0001, t+d); o.connect(g).connect(out || master); o.start(t); o.stop(t+d+0.05); }
let nb = null;
function nz(t, d, vol, type='highpass', fr=7000, out){ if (!actx) return; if (!nb){ nb = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const c = nb.getChannelData(0); for (let i=0;i<c.length;i++) c[i] = Math.random()*2-1; }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = nb; f.type = type; f.frequency.value = fr; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+d); s.connect(f).connect(g).connect(out || master); s.start(t); s.stop(t+d+0.02); }
const T0 = () => actx ? actx.currentTime : 0;
const sfx = {
  tick:  hi => osc(hi ? 1400 : 1000, T0(), 0.05, 'square', 0.07),
  ding:  ()=>{ [880,1108,1318,1760].forEach((f,i)=>osc(f, T0()+i*0.06, 0.25, 'triangle', 0.13)); nz(T0(), 0.8, 0.12, 'bandpass', 2500); },
  buzz:  ()=>{ osc(140, T0(), 0.5, 'sawtooth', 0.18); osc(147, T0(), 0.5, 'sawtooth', 0.18); },
  swap:  ()=>{ for (let i=0;i<6;i++) osc(i%2 ? 500 : 900, T0()+i*0.09, 0.08, 'square', 0.1); },
  beep:  ()=> osc(660, T0(), 0.15, 'square', 0.12),
  go:    ()=> osc(990, T0(), 0.4, 'square', 0.14),
  win:   ()=> [523,659,784,1046,1318,1568].forEach((f,i)=>osc(f, T0()+i*0.12, 0.3, 'square', 0.1)),
};
const music = {on:false, muted:false, bpm:126, next:0, step:0, timer:null};
const PROG = [[110,220,277,330],[123,246,311,370],[98,196,247,294],[110,220,277,330]];
function startMusic(){ audio(); if (!actx) return; if (!music.on){ music.on = true; music.next = actx.currentTime + 0.05; music.step = 0; } if (!music.timer) music.timer = setInterval(sched, 25); }
function sched(){ if (!music.on || !actx) return; const spb = 60/music.bpm/4;
  while (music.next < actx.currentTime + 0.12){ const s = music.step, t = music.next, st = s%16, ch = PROG[Math.floor(s/16)%4];
    if (!music.muted && state === 'play'){
      if (st % 4 === 0) osc(150, t, 0.16, 'sine', 0.5, 45, mus);
      if (st % 8 === 4) nz(t, 0.14, 0.25, 'bandpass', 1800, mus);
      nz(t, 0.03, st % 2 ? 0.04 : 0.08, 'highpass', 8000, mus);
      if ([0,3,6,10,12].includes(st)) osc(ch[0], t, 0.14, 'sawtooth', 0.11, null, mus);
      if (st % 2 === 0 && phase === 'ask') osc(ch[1 + (st/2)%3]*2, t, 0.1, 'square', 0.03, null, mus);
    }
    music.next += spb; music.step = (s + 1) % 64; } }
addEventListener('keydown', e => { if (e.code === 'KeyM'){ music.muted = !music.muted; } if (e.code === 'Escape') showStart(); });

// ---------- โจทย์ ----------
const R = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function makeQ(){
  let a, b, op, ans;
  const r = Math.random();
  if (level === 0){
    if (r < 0.45){ op = '+'; a = R(1, 15); b = R(1, 12); ans = a+b; }
    else if (r < 0.85){ op = '−'; a = R(5, 25); b = R(1, a-1); ans = a-b; }
    else { op = '×'; a = R(2, 5); b = [2,5,10][R(0,2)]; ans = a*b; }
  } else {
    if (r < 0.45){ op = '×'; a = R(3, 12); b = R(3, 12); ans = a*b; }
    else if (r < 0.75){ op = '÷'; b = R(2, 12); ans = R(2, 12); a = b*ans; }
    else { op = Math.random() < 0.5 ? '+' : '−'; a = R(20, 99); b = R(11, op === '+' ? 99 : a-1); ans = op === '+' ? a+b : a-b; }
  }
  const truth = Math.random() < 0.5; let shown = ans;
  if (!truth){ // คำตอบมั่วแบบหลอกตา
    const tricks = [ans+1, ans-1, ans+2, ans-2, ans+10, ans-10];
    if (ans >= 10){ const s = String(ans); tricks.push(+s.split('').reverse().join('')); }
    if (op === '×') tricks.push(a*(b+1), (a+1)*b, a+b);
    if (op === '+') tricks.push(Math.abs(a-b));
    const ok = tricks.filter(v => v >= 0 && v !== ans); shown = ok[R(0, ok.length-1)];
  }
  return {text:`${a} ${op} ${b} = ${shown}`, truth, ans, a, b, op};
}
const askTime = () => Math.max(1.6, 4.2 - round*0.14); // เร็วขึ้นทุกข้อ

// ---------- เกม ----------
window.setLv = i => { level = i; [0,1].forEach(k => document.getElementById('lv'+k).classList.toggle('on', k===i)); };
window.showStart = ()=>{ state = 'menu'; music.on = false; document.getElementById('end').classList.add('hidden'); document.getElementById('start').classList.remove('hidden'); };
window.startGame = ()=>{
  audio(); startMusic(); round = 0; teamScore = 0; correctPeople = 0; totalPeople = 0; allRight = 0; streak = 0; bestStreak = 0; particles = []; floaters = []; banner = null; swapNext = false;
  state = 'countdown'; countdown = 3.999; lastBeep = 4; music.bpm = 126;
  document.getElementById('start').classList.add('hidden'); document.getElementById('end').classList.add('hidden');
};
function nextQ(){
  if (round >= ROUNDS){ endGame(); return; }
  round++; q = makeQ(); q.swap = swapNext; swapNext = false;
  if (round > 4 && Math.random() < 0.22 && round < ROUNDS) swapNext = true; // ประกาศสลับฝั่งข้อหน้า
  phase = q.swap ? 'swapWarn' : 'ask'; phaseT = q.swap ? 1.3 : askTime(); q.max = askTime();
  music.bpm = 126 + round*2;
  if (q.swap){ sfx.swap(); banner = {text:'สลับฝั่ง!!', sub:'ข้อนี้ ซ้าย = มั่ว · ขวา = จริง', t:1.3}; flash = {col:GOLD, t:0.3}; }
}
const sideOf = x => x < W*(0.5 - MID) ? 'L' : x > W*(0.5 + MID) ? 'R' : 'M';
function reveal(){
  phase = 'reveal'; phaseT = 1.4;
  const goodSide = (q.truth !== !!q.swap) ? 'L' : 'R';
  let ok = 0, n = 0;
  for (const p of people){ const s = sideOf(p.x); p.res = s === goodSide ? 'ok' : s === 'M' ? 'mid' : 'bad'; n++; if (p.res === 'ok') ok++; }
  q.good = goodSide; q.ok = ok; q.n = n;
  totalPeople += n; correctPeople += ok; teamScore += ok*100;
  if (n > 0 && ok === n){ streak++; allRight++; bestStreak = Math.max(bestStreak, streak); teamScore += 50*streak; sfx.ding(); confetti(goodSide === 'L' ? 0 : W/2, goodSide === 'L' ? W/2 : W);
    floatText(n > 1 ? `รอดทุกคน! +${ok*100 + 50*streak}` : `ถูก! +${100 + 50*streak}`, W/2, H*0.55, GOLD); }
  else { streak = 0; ok > 0 ? sfx.ding() : sfx.buzz(); if (ok > 0) confetti(goodSide === 'L' ? 0 : W/2, goodSide === 'L' ? W/2 : W);
    if (n === 0) floatText('ไม่มีใครยืนเลย!', W/2, H*0.55, '#fff'); else floatText(ok ? `ถูก ${ok} คน จาก ${n}` : 'ตูม! ผิดหมดเลย', W/2, H*0.55, ok ? '#fff' : '#ff8a8a'); }
  flash = {col: goodSide === 'L' ? GREEN : RED, t:0.35, side: goodSide};
}
function endGame(){
  state = 'over'; music.on = false; sfx.win(); confetti(0, W);
  const acc = totalPeople ? Math.round(correctPeople/totalPeople*100) : 0;
  setTimeout(()=>{
    document.getElementById('endTitle').textContent = acc >= 90 ? 'สมองเทพ ขาไว!' : acc >= 70 ? 'คิดไว วิ่งไว!' : acc >= 50 ? 'เก่งมาก!' : 'สนุกสุด ๆ!';
    document.getElementById('endText').innerHTML = `คะแนนทีม <b style="color:#ffcf3a;font-size:1.3em">${teamScore}</b><br>ตอบถูก ${acc}% · รอดทุกคน ${allRight}/${ROUNDS} ข้อ · ถูกติดกันสูงสุด ${bestStreak} ข้อ`;
    document.getElementById('end').classList.remove('hidden');
  }, 1300);
}
function confetti(x0, x1){ const c = [GOLD, '#fff', GREEN, '#ff7aa8', '#7fd3ff']; for (let i=0;i<70;i++) particles.push({x:x0 + Math.random()*(x1-x0), y:-10 - Math.random()*H*0.3, vx:(Math.random()-0.5)*160, vy:200+Math.random()*250, c:c[i%5], life:1.8, r:5+Math.random()*4, rot:Math.random()*6}); }
function floatText(text, x, y, col){ floaters.push({text, x, y, col, t:1.3}); }

// ---------- จับคน ----------
let poseOK = false, landmarker = null, lastVideoTime = -1, mouseX = null;
addEventListener('mousemove', e => { if (!poseOK) mouseX = e.clientX; });
async function initPose(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play(); statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับคน...';
    const {FilesetResolver, PoseLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task', delegate:d}, runningMode:'VIDEO', numPoses:5});
    try { landmarker = await PoseLandmarker.createFromOptions(fs, opts('GPU')); } catch { landmarker = await PoseLandmarker.createFromOptions(fs, opts('CPU')); }
    poseOK = true; statusEl.textContent = 'พร้อมเล่น! ยืนให้กล้องเห็นทุกคน';
  }catch(err){ console.error(err); statusEl.textContent = 'เปิดกล้องไม่ได้ · ทดลองเล่นด้วยการเลื่อนเมาส์ซ้าย/ขวาได้'; }
}
function trackPeople(){
  if (window.__fake){ people = window.__fake(); return; }
  if (!poseOK){ people = mouseX == null ? [] : [{x:mouseX, y:H*0.5, lm:null, res:people[0] && people[0].res}]; return; }
  if (video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const r = landmarker.detectForVideo(video, performance.now()), vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W/vw, H/vh);
  const m = p => ({x: W - ((W - vw*s)/2 + p.x*vw*s), y: (H - vh*s)/2 + p.y*vh*s, v: p.visibility ?? 1});
  const prev = people;
  people = (r.landmarks || []).map(L => { const lm = L.map(m), x = (lm[11].x + lm[12].x + lm[23].x + lm[24].x)/4;
    const o = prev.find(q => Math.abs(q.x - x) < W*0.08); return {x: o ? o.x + (x - o.x)*0.6 : x, y: lm[0].y, lm, res: o ? o.res : null}; });
}

// ---------- วาด ----------
function label(t, x, y, size, fill='#fff', stroke='#5a0612'){
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(5, size*0.16); ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); ctx.fillStyle = fill; ctx.fillText(t, x, y);
}
function drawBG(t){
  if (poseOK && video.videoWidth){
    const vw=video.videoWidth, vh=video.videoHeight, s=Math.max(W/vw,H/vh);
    ctx.save(); ctx.translate(W,0); ctx.scale(-1,1); ctx.drawImage(video,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s); ctx.restore();
  } else { ctx.fillStyle = '#3a0c18'; ctx.fillRect(0,0,W,H); }
  const swapNow = q && q.swap && state === 'play';
  const lc = swapNow ? RED : GREEN, rc = swapNow ? GREEN : RED;
  const lit = phase === 'reveal' && q ? q.good : null, k = phase === 'reveal' ? 0.5 + 0.2*Math.sin(t/60) : 0.28;
  ctx.globalAlpha = lit === 'R' ? 0.12 : k; ctx.fillStyle = lc; ctx.fillRect(0, 0, W*(0.5 - MID), H);
  ctx.globalAlpha = lit === 'L' ? 0.12 : k; ctx.fillStyle = rc; ctx.fillRect(W*(0.5 + MID), 0, W*(0.5 - MID), H);
  ctx.globalAlpha = 0.45; ctx.fillStyle = '#1a0408'; ctx.fillRect(W*(0.5 - MID), 0, W*MID*2, H); ctx.globalAlpha = 1;
  // ไฟกระพริบขอบเวที
  const n = Math.floor(W/46);
  for (let i=0;i<n;i++){ const on = (Math.floor(t/120) + i) % 3 === 0; ctx.fillStyle = on ? '#fff6c0' : '#a8781a'; ctx.beginPath(); ctx.arc(23 + i*46, 14, 7, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(23 + i*46, H-14, 7, 0, Math.PI*2); ctx.fill(); }
  // ป้ายฝั่ง
  const u = Math.min(W,H);
  label(swapNow ? 'มั่ว ✗' : 'จริง ✓', W*0.21, H*0.86, u*0.11, '#fff', swapNow ? '#7a1408' : '#0d5a26');
  label(swapNow ? 'จริง ✓' : 'มั่ว ✗', W*0.79, H*0.86, u*0.11, '#fff', swapNow ? '#0d5a26' : '#7a1408');
  ctx.font = `700 ${u*0.03}px ${FONT}`; ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.textAlign = 'center'; ctx.fillText('ห้ามยืนตรงกลาง!', W/2, H*0.93);
}
const PB = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawPeople(t){
  for (const p of people){
    const res = phase === 'reveal' ? p.res : null, col = res === 'ok' ? '#5dff8c' : res ? '#ff5a5a' : '#fff';
    if (p.lm){ ctx.lineCap = 'round';
      for (const [a,b] of PB){ const A = p.lm[a], B = p.lm[b]; if (A.v < 0.3 || B.v < 0.3) continue;
        ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
        ctx.strokeStyle = col; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke(); } }
    const y = p.lm ? Math.min(p.lm[0].y, p.lm[11].y) - Math.min(W,H)*0.1 : H*0.45, u = Math.min(W,H);
    if (res){ const s = 1 + 0.1*Math.sin(t/80); label(res === 'ok' ? '✓' : res === 'mid' ? 'ลังเล!' : '✗', p.x, y, u*(res === 'mid' ? 0.06 : 0.12)*s, col, '#000'); }
    else { ctx.fillStyle = sideOf(p.x) === 'M' ? GOLD : '#fff'; ctx.beginPath(); ctx.moveTo(p.x, y + 18); ctx.lineTo(p.x - 14, y - 4); ctx.lineTo(p.x + 14, y - 4); ctx.closePath(); ctx.fill(); }
  }
}
function drawQuestion(t){
  if (!q) return;
  const u = Math.min(W,H), bw = Math.min(W*0.7, u*1.35), bh = u*0.2, bx = (W - bw)/2, by = H*0.1;
  const pop = phase === 'ask' ? Math.min(1, (q.max - phaseT)*6) : 1, s = 0.7 + 0.3*pop;
  ctx.save(); ctx.translate(W/2, by + bh/2); ctx.scale(s, s); ctx.translate(-W/2, -(by + bh/2));
  ctx.fillStyle = '#6e0a1a'; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 26); ctx.fill();
  ctx.strokeStyle = GOLD; ctx.lineWidth = 7; ctx.stroke();
  ctx.font = `900 ${u*0.03}px ${FONT}`; ctx.fillStyle = GOLD; ctx.textAlign = 'center'; ctx.fillText(`ข้อ ${round}/${ROUNDS}`, W/2, by + u*0.03);
  let txt = q.text; if (phase === 'reveal' && !q.truth) txt = `${q.a} ${q.op} ${q.b} = ${q.ans} (ไม่ใช่ ${q.text.split('= ')[1]})`;
  label(txt, W/2, by + bh*0.58, u*(txt.length > 16 ? 0.075 : 0.11), phase === 'reveal' ? (q.truth ? '#5dff8c' : '#ffd0d0') : '#fff');
  if (phase === 'reveal'){ label(q.truth ? 'จริง!' : 'มั่ว!', bx + bw - u*0.1, by + bh - u*0.02, u*0.08, q.truth ? '#5dff8c' : '#ff5a5a', '#000'); }
  ctx.restore();
  if (phase === 'ask'){ // ฟิวส์เวลา
    const k = Math.max(0, phaseT/q.max), fy = by + bh + u*0.035, fx0 = bx + 10, fx1 = bx + bw - 10;
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(fx0, fy); ctx.lineTo(fx1, fy); ctx.stroke();
    const ex = fx0 + (fx1 - fx0)*k; ctx.strokeStyle = k > 0.35 ? GOLD : '#ff5a3a'; ctx.beginPath(); ctx.moveTo(fx0, fy); ctx.lineTo(ex, fy); ctx.stroke();
    for (let i=0;i<3;i++){ ctx.fillStyle = ['#fff6a0','#ffb020','#ff5a3a'][i]; ctx.beginPath(); ctx.arc(ex + (Math.random()-0.5)*10, fy + (Math.random()-0.5)*10, 9 - i*2, 0, Math.PI*2); ctx.fill(); }
    label(phaseT.toFixed(1), W/2, fy + u*0.06, u*0.05, k > 0.35 ? '#fff' : '#ff8a6a');
  }
}
function drawHUD(){
  const u = Math.min(W,H);
  label(`คะแนน ${teamScore}`, W*0.14, H*0.06 + 16, u*0.045, GOLD);
  label(`${people.length} คน`, W*0.86, H*0.06 + 16, u*0.04, '#fff');
  if (streak >= 2) label(`ถูกติดกัน x${streak} 🔥`, W*0.86, H*0.06 + 16 + u*0.06, u*0.035, '#ffb36b');
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackPeople(); drawBG(t);
  if (flash){ flash.t -= dt; if (flash.t <= 0) flash = null; else { ctx.globalAlpha = flash.t*1.5; ctx.fillStyle = flash.col; flash.side ? ctx.fillRect(flash.side === 'L' ? 0 : W/2, 0, W/2, H) : ctx.fillRect(0,0,W,H); ctx.globalAlpha = 1; } }
  if (state === 'play'){
    phaseT -= dt;
    if (phase === 'swapWarn' && phaseT <= 0){ phase = 'ask'; phaseT = q.max; }
    else if (phase === 'ask'){ const b = Math.ceil(phaseT*2); if (b !== q.lastTick && phaseT < q.max){ q.lastTick = b; sfx.tick(phaseT < 1.2); } if (phaseT <= 0) reveal(); }
    else if (phase === 'reveal' && phaseT <= 0) nextQ();
  }
  if (state !== 'menu'){
    drawPeople(t);
    if (state === 'play' && phase !== 'swapWarn') drawQuestion(t);
    if (state !== 'countdown') drawHUD();
  }
  if (state === 'countdown'){
    countdown -= dt; const n = Math.ceil(countdown);
    if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
    if (countdown <= 0){ sfx.go(); state = 'play'; nextQ(); }
    else { label(String(n), W/2, H*0.4, Math.min(W,H)*0.25, GOLD); label('ซ้าย = จริง · ขวา = มั่ว', W/2, H*0.62, Math.min(W,H)*0.06); }
  }
  for (const p of particles){ p.vy += 300*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.rot += dt*6; p.life -= dt*0.7;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.r, -p.r*0.5, p.r*2, p.r); ctx.restore(); }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+30);
  for (const f of floaters){ f.t -= dt; f.y -= 40*dt; ctx.globalAlpha = Math.max(0, Math.min(1, f.t*2)); label(f.text, f.x, f.y, Math.min(W,H)*0.07, f.col); }
  ctx.globalAlpha = 1; floaters = floaters.filter(f => f.t > 0);
  if (banner){ banner.t -= dt; if (banner.t <= 0) banner = null; else { const s = 1 + 0.08*Math.sin(t/60); ctx.fillStyle = 'rgba(110,10,26,.85)'; ctx.fillRect(0, H*0.3, W, H*0.28); label(banner.text, W/2, H*0.4, Math.min(W,H)*0.14*s, GOLD); label(banner.sub, W/2, H*0.52, Math.min(W,H)*0.045); } }
  requestAnimationFrame(loop);
}
window.__tf = () => ({state, round, q, phase, people, teamScore, correctPeople, totalPeople});
resize(); initPose(); requestAnimationFrame(loop);
</script>
